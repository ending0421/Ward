name: Quality

# Reusable quality gate: format, lint, unit tests, coverage threshold.
# Called by both the PR/push CI and the release pipeline so every release
# is blocked on exactly the same checks that block merges.

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit & integration tests
        run: cargo test --workspace

  coverage:
    name: coverage gate (>= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 85
