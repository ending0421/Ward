name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality gate
    uses: ./.github/workflows/quality.yml

  dogfood-spot:
    name: dogfood (index + spot on self)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ward
        run: cargo build --release -p ward-cli
      - name: Index self (Ward dogfoods Ward)
        run: ./target/release/ward index --repo .
      - name: Spot smoke (must find simhash)
        run: |
          ./target/release/ward spot --repo . \
            --intent "simhash 结构近重复指纹" \
            --signature "pub fn simhash(features: &[u64]) -> u64" \
            --json | tee /tmp/spot.json
          python3 - <<'EOF'
          import json
          r = json.load(open("/tmp/spot.json"))
          assert r["matches"], "dogfood spot must match its own simhash"
          print("dogfood spot OK:", [(m["path"], m["lines"], m["similarity"]) for m in r["matches"]])
          EOF
      - name: Hook smoke (PostToolUse auto spot-file + additionalContext)
        run: |
          set -euo pipefail
          WARD="$(pwd)/target/release/ward"
          TMP="$(mktemp -d)"
          cd "$TMP"
          git init -q .
          git config user.email t@t
          git config user.name t
          mkdir -p src
          printf 'pub fn debounce(f: &dyn Fn(u64), ms: u64) -> u8 { f(ms); 0 }\n' > src/lib.rs
          git add -A && git commit -qm c1
          "$WARD" index --repo . >/dev/null
          printf 'pub fn debounce2(f: &dyn Fn(u64), ms: u64) -> u8 { f(ms); 0 }\n' > src/new.rs
          OUT="$(WARD_BIN="$WARD" WARD_REPO_ROOT="$TMP" "$OLDPWD/hooks/posttooluse-spot.sh" Write '{"file_path":"src/new.rs"}')"
          echo "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "debounce" in d["additionalContext"], d'
          echo "hook smoke OK"

  spec-gate:
    name: task spec gate (form-check --ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks (api_compat tool, spec §3-M4)
        run: cargo install cargo-semver-checks --locked
      - name: Build ward
        run: cargo build --release -p ward-cli
      - name: Form-check the active task spec (fail-closed; api_compat adjudicated here)
        run: ./target/release/ward form-check --repo . --spec specs/2026-08-gov-data.md --ci

  meaningful-smoke:
    name: meaningfulness harness (recall/precision + adversarial semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ward
        run: cargo build --release -p ward-cli
      - name: Run the 11-check harness
        run: |
          scripts/verify-meaningful.sh "$(pwd)/target/release/ward"

  duplication-baseline:
    name: duplication baseline (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jscpd baseline (token-level CPD; trend-comparable, not GitClear-absolute)
        run: |
          npm install -g jscpd >/dev/null 2>&1 || npm install jscpd >/dev/null 2>&1 || true
          npx --yes jscpd --mode strict --format console . --reporters console --min-lines 5 || echo "jscpd unavailable on this runner (fail-open)"
