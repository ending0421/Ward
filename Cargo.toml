[workspace]
resolver = "2"
members = [
    "crates/ward-core",
    "crates/ward-cli",
    "crates/ward-mcp",
    "crates/ward-bench",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ending0421/Ward"
description = "Ward off AI slop: guardrails and verification for AI agent coding"

[workspace.dependencies]
ward-core = { path = "crates/ward-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1" }
tree-sitter-swift = "0.7.3"
tree-sitter-objc = "3.0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"
serde_yaml = "0.9"
